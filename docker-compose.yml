services:
  app:
    build: .
    env_file: .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      AWS_ENDPOINT: http://minio:9000
      REVERB_HOST: reverb
    ports: ["8000:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      minio: {condition: service_started}
  queue:
    build: .
    env_file: .env
    environment: {APP_ENV: local, DB_CONNECTION: pgsql, DB_HOST: postgres, REDIS_HOST: redis, AWS_ENDPOINT: http://minio:9000, REVERB_HOST: reverb}
    command: ["php", "artisan", "queue:work", "redis", "--tries=3", "--timeout=90"]
    depends_on: [postgres, redis]
  scheduler:
    build: .
    env_file: .env
    environment: {APP_ENV: local, DB_CONNECTION: pgsql, DB_HOST: postgres, REDIS_HOST: redis}
    command: ["php", "artisan", "schedule:work"]
    depends_on: [postgres, redis]
  reverb:
    build: .
    env_file: .env
    environment: {APP_ENV: local, DB_CONNECTION: pgsql, DB_HOST: postgres, REDIS_HOST: redis}
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports: ["8080:8080"]
    depends_on: [redis]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: africonnect
      POSTGRES_USER: africonnect
      POSTGRES_PASSWORD: local-only-change-me
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U africonnect"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: local-minio-secret-change-me
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdata:
  redisdata:
  miniodata:
